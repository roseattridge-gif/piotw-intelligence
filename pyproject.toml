[project]
name = "piotw-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6", "pypdf>=6", "cryptography>=3.1"]

[project.optional-dependencies]
research = ["pandas", "numpy", "duckdb", "scikit-learn", "statsmodels", "matplotlib"]
test = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
