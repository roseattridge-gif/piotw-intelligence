signal_definitions:
  - {signal_id: revenue_yoy_change_pct, input_observations: [revenue], transformation_formula: '(current / previous - 1) * 100', window: two_comparable_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [profit_warning, material_margin_deterioration], validation_status: implemented_not_predictively_validated}
  - {signal_id: operating_margin_change_bps, input_observations: [operating_margin], transformation_formula: '(current - previous) * 100', window: two_comparable_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [material_margin_deterioration, restructuring], validation_status: implemented_not_predictively_validated}
  - {signal_id: free_cash_flow_change_pct, input_observations: [free_cash_flow], transformation_formula: '(current / previous - 1) * 100', window: two_comparable_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [restructuring, profit_warning], validation_status: implemented_not_predictively_validated}
  - {signal_id: net_debt_change_pct, input_observations: [net_debt], transformation_formula: '(current / previous - 1) * 100', window: two_comparable_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [refinancing, restructuring], validation_status: implemented_not_predictively_validated}
  - {signal_id: cash_conversion_change_bps, input_observations: [cash_conversion], transformation_formula: '(current - previous) * 100', window: two_comparable_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [profit_warning, material_margin_deterioration], validation_status: implemented_not_predictively_validated}
  - {signal_id: capex_growth_pct, input_observations: [capex], transformation_formula: '(current / previous - 1) * 100', window: two_comparable_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [capacity_expansion, major_investment], validation_status: implemented_not_predictively_validated}
  - {signal_id: event_count, input_observations: [atomic_event], transformation_formula: count_current_period, window: reporting_period, signal_class: state, minimum_history: 1, applicable_sector: all, candidate_prediction_relationships: [restructuring, site_closure, capacity_expansion], validation_status: implemented_template_not_predictively_validated}
  - {signal_id: event_mentions_change, input_observations: [atomic_event], transformation_formula: current_count_minus_previous_count, window: two_reporting_periods, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [restructuring, site_closure, capacity_expansion], validation_status: implemented_template_not_predictively_validated}
  - {signal_id: event_new_flag, input_observations: [atomic_event], transformation_formula: one_if_absent_in_previous_period, window: two_reporting_periods, signal_class: novelty, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [restructuring, site_closure, capacity_expansion], validation_status: implemented_template_not_predictively_validated}
  - {signal_id: event_persistence_periods, input_observations: [atomic_event], transformation_formula: count_distinct_periods_present, window: available_history, signal_class: persistence, minimum_history: 1, applicable_sector: all, candidate_prediction_relationships: [restructuring, operational_disruption], validation_status: implemented_template_not_predictively_validated}
  - {signal_id: open_vacancy_count, input_observations: [job_posting], transformation_formula: count_open_deduplicated_postings, window: snapshot, signal_class: state, minimum_history: 1, applicable_sector: all, candidate_prediction_relationships: [workforce_reduction, capacity_expansion], validation_status: implemented_not_predictively_validated}
  - {signal_id: vacancy_count_change, input_observations: [job_posting], transformation_formula: current_open_minus_previous_open, window: two_snapshots, signal_class: change, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [workforce_reduction, capacity_expansion], validation_status: implemented_not_predictively_validated}
  - {signal_id: vacancy_velocity_new, input_observations: [job_posting], transformation_formula: count_new_posting_ids_since_previous_snapshot, window: two_snapshots, signal_class: velocity, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [capacity_expansion, major_investment], validation_status: implemented_not_predictively_validated}
  - {signal_id: functional_hiring_share, input_observations: [job_posting], transformation_formula: function_open_count_divided_by_all_open_count, window: snapshot, signal_class: state, minimum_history: 1, applicable_sector: all, candidate_prediction_relationships: [leadership_intervention, capacity_expansion], validation_status: implemented_not_predictively_validated}
  - {signal_id: geographic_hiring_expansion, input_observations: [job_posting], transformation_formula: count_new_locations_since_previous_snapshot, window: two_snapshots, signal_class: novelty, minimum_history: 2, applicable_sector: all, candidate_prediction_relationships: [capacity_expansion, geographic_expansion], validation_status: implemented_not_predictively_validated}

outcome_definitions:
  - {outcome_id: restructuring, precise_event_definition: material_company_operational_or_organisational_restructuring, horizon_options: [3_months, 6_months, 12_months], adjudication_requirements: independently_sourced_dated_event}
  - {outcome_id: profit_warning, precise_event_definition: issuer_or_regulator_confirmed_material_downward_guidance_revision, horizon_options: [3_months, 6_months, 12_months], adjudication_requirements: independently_sourced_dated_event}
  - {outcome_id: material_margin_deterioration, precise_event_definition: predefined_comparable_margin_decline_threshold, horizon_options: [6_months, 12_months], adjudication_requirements: independently_verified_comparable_financials}
  - {outcome_id: workforce_reduction, precise_event_definition: announced_or_confirmed_material_workforce_reduction, horizon_options: [3_months, 6_months, 12_months], adjudication_requirements: independently_sourced_scope_and_date}
  - {outcome_id: site_closure, precise_event_definition: announced_or_completed_material_operating_site_closure, horizon_options: [6_months, 12_months, 24_months], adjudication_requirements: independently_sourced_site_scope_and_date}
  - {outcome_id: leadership_intervention, precise_event_definition: material_executive_or_operational_leadership_change, horizon_options: [3_months, 6_months, 12_months], adjudication_requirements: independently_sourced_role_and_date}
  - {outcome_id: capacity_expansion, precise_event_definition: committed_or_completed_material_productive_capacity_increase, horizon_options: [6_months, 12_months, 24_months], adjudication_requirements: independently_sourced_capacity_scope_and_date}
  - {outcome_id: major_investment, precise_event_definition: announced_or_committed_material_operational_investment, horizon_options: [6_months, 12_months, 24_months], adjudication_requirements: independently_sourced_amount_scope_and_date}
  - {outcome_id: geographic_expansion, precise_event_definition: material_entry_into_new_operating_geography, horizon_options: [6_months, 12_months, 24_months], adjudication_requirements: independently_sourced_geography_scope_and_date}
  - {outcome_id: operational_disruption, precise_event_definition: material interruption_to_delivery_or_production, horizon_options: [3_months, 6_months, 12_months], adjudication_requirements: independently_sourced_scope_duration_and_date}
  - {outcome_id: refinancing, precise_event_definition: announced_or_completed_material_debt_refinancing, horizon_options: [3_months, 6_months, 12_months], adjudication_requirements: independently_sourced_terms_scope_and_date}
