  site_closure: [delivery_capacity, change_execution]
  capacity_reduction: [delivery_capacity, change_execution]
  redundancy: [workforce_capability, change_execution]
  workforce_reduction: [workforce_capability, change_execution]
  hiring: [workforce_capability]
