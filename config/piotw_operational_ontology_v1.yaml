ontology_id: piotw_operational_ontology
version: 1.0.0-candidate
status: CANDIDATE PRODUCT ONTOLOGY — NOT YET EMPIRICALLY VALIDATED
effective_from: 2026-08-17
principles:
  - dimensions_are_conceptual_areas_not_scores
  - observations_are_source_supported_facts
  - signals_are_versioned_transformations
  - outcomes_are_future_events_with_explicit_horizons
  - no_predictive_weights_in_ontology

dimension_definitions:
  - dimension_id: demand_growth
    name: Demand & Growth
    definition: Strength, weakness and composition of demand for the organisation's products or services.
    inclusion_rules: [orders, backlog, volumes, customer demand, revenue growth attributable to demand, market entry]
    exclusion_rules: [pure accounting growth assumptions, expense growth, generic macroeconomic scenarios]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: delivery_capacity
    name: Delivery & Capacity
    definition: Ability to deliver required output and changes in productive capacity or utilisation.
    inclusion_rules: [throughput, utilisation, delivery delay, operational disruption, capacity additions, capacity reductions, site openings, site closures]
    exclusion_rules: [demand alone, unimplemented hypothetical capacity risks]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: cost_productivity
    name: Cost & Productivity
    definition: Efficiency with which operating resources are converted into output and margin.
    inclusion_rules: [operating margin, gross margin, cost base, productivity, efficiency programmes, inflation absorbed by operations]
    exclusion_rules: [financing costs, definitions of cost-saving measures without an actual programme]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: cash_working_capital
    name: Cash & Working Capital
    definition: Conversion of operations into cash and management of inventory, receivables, liquidity and operating funding needs.
    inclusion_rules: [operating cash flow, free cash flow, cash conversion, inventory, receivables, working capital, liquidity, leverage]
    exclusion_rules: [revenue or margin without a cash relationship]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: workforce_capability
    name: Workforce & Capability
    definition: Availability, retention and development of people, leadership and skills required to execute.
    inclusion_rules: [vacancies, hiring mix, labour shortages, strikes, workforce reduction, redundancy, skills investment, leadership capability]
    exclusion_rules: [biographies, prior-employer events, generic labour-market risks]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: supply_chain_resilience
    name: Supply Chain & Resilience
    definition: Stability and resilience of suppliers, sourcing, materials, logistics and critical operating dependencies.
    inclusion_rules: [supplier disruption, material shortages, logistics constraints, sourcing concentration, recovery actions]
    exclusion_rules: [global disruption without target-company exposure, audit procedures that merely mention supply chains]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: quality_customer
    name: Quality & Customer
    definition: Consistency of outcomes for customers and regulators, including defects, recalls, service quality and customer health.
    inclusion_rules: [quality failures, warranty burden, recalls, customer complaints, customer weakness, regulatory operating intervention]
    exclusion_rules: [unrelated litigation lists, generic product-risk boilerplate]
    applicability: universal
    version: 1.0.0-candidate
  - dimension_id: change_execution
    name: Change & Execution
    definition: Initiation, scope and execution of material operational change.
    inclusion_rules: [restructuring, transformation, simplification, footprint change, investment programme, implementation progress]
    exclusion_rules: [accounting definitions, legal references, management aspiration without action, historical programmes represented as current]
    applicability: universal
    version: 1.0.0-candidate

observation_definitions:
  - {observation_type: revenue, dimension_ids: [demand_growth], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: ebitda, dimension_ids: [cost_productivity], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: operating_profit, dimension_ids: [cost_productivity], data_type: number, unit: currency, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: operating_margin, dimension_ids: [cost_productivity], data_type: number, unit: percent, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: gross_margin, dimension_ids: [cost_productivity], data_type: number, unit: percent, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: operating_cash_flow, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: free_cash_flow, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: cash_conversion, dimension_ids: [cash_working_capital], data_type: number, unit: percent, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: net_debt, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: lower_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: net_cash, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: leverage, dimension_ids: [cash_working_capital], data_type: number, unit: ratio, directionality: lower_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: working_capital, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: inventory, dimension_ids: [cash_working_capital, supply_chain_resilience], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: receivables, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: liquidity, dimension_ids: [cash_working_capital], data_type: number, unit: currency, directionality: higher_generally_favourable, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: capex, dimension_ids: [delivery_capacity, change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures, physical_footprint_capacity]}
  - {observation_type: investment_commitments, dimension_ids: [delivery_capacity, change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_commitment_period_span, source_compatibility: [issuer_disclosures, physical_footprint_capacity]}
  - {observation_type: restructuring_provisions, dimension_ids: [change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: restructuring_charges, dimension_ids: [change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: exceptional_costs, dimension_ids: [cost_productivity, change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: impairment_charges, dimension_ids: [cost_productivity, change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: redundancy_costs, dimension_ids: [workforce_capability, change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: site_closure_costs, dimension_ids: [delivery_capacity, change_execution], data_type: number, unit: currency, directionality: context_dependent, evidence_requirements: exact_period_value_basis_span, source_compatibility: [issuer_disclosures]}
  - {observation_type: job_posting, dimension_ids: [workforce_capability], data_type: record, unit: posting, directionality: none, evidence_requirements: stable_url_or_external_id_and_snapshot, source_compatibility: [careers_ats]}

